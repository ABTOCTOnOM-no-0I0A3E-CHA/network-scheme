openapi: 3.1.0
info:
  title: network-scheme panel API
  version: 0.0.0
  description: |
    Panel API. Sessions use the `__Host-nms_session` cookie (Secure; HttpOnly;
    SameSite=Strict; Path=/). Every state-changing request made with a session
    must carry `X-CSRF-Token` equal to `csrf_token` from `GET /api/auth/me`.
    Request bodies are JSON (`Content-Type: application/json`), at most 1 MiB,
    unknown fields rejected. Rate limits per client IP: 10/min on login, totp,
    enroll and stepup; 600/min overall.
servers:
  - url: /
security:
  - session: []
paths:
  /api/health:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/auth/login:
    post:
      summary: Check username and password, start the second factor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Second step required
          content:
            application/json:
              schema:
                type: object
                required: [stage, challenge]
                properties:
                  stage: { type: string, enum: [totp, enroll] }
                  challenge: { type: string, description: "Valid for 5 minutes, single use" }
                  otpauth_uri: { type: string, description: "enroll only: the new TOTP secret" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/totp:
    post:
      summary: Complete a "totp" challenge with a TOTP or backup code
      security: []
      requestBody: { $ref: "#/components/requestBodies/ChallengeCode" }
      responses:
        "204":
          description: Logged in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/enroll:
    post:
      summary: Complete an "enroll" challenge with a code from the new secret
      security: []
      requestBody: { $ref: "#/components/requestBodies/ChallengeCode" }
      responses:
        "200":
          description: Enrolled and logged in; backup codes are shown once
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema:
                type: object
                required: [backup_codes]
                properties:
                  backup_codes:
                    type: array
                    items: { type: string }
                    minItems: 10
                    maxItems: 10
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/stepup:
    post:
      summary: Re-confirm with a TOTP code; rotates the session token
      x-permission: self
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204":
          description: Step-up valid for 5 minutes
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      summary: End the session
      x-permission: self
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204":
          description: Logged out; the cookie is cleared (Max-Age=0)
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/auth/me:
    get:
      summary: Current user, role bindings and CSRF token
      x-permission: self
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [id, username, roles, csrf_token]
                properties:
                  id: { type: integer, format: int64 }
                  username: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      required: [role, group_id]
                      properties:
                        role: { type: string, enum: [viewer, operator, admin, auditor] }
                        group_id:
                          type: [integer, "null"]
                          format: int64
                          description: null for a global binding
                  csrf_token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/users:
    get:
      summary: List panel users
      x-permission: users.manage
      responses:
        "200":
          description: Users ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a user without TOTP (it enrolls at the first login)
      x-permission: users.manage
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/users/{id}:
    patch:
      summary: Enable or disable a user; disabling ends its sessions
      description: Disabling the last enabled global admin answers 409 last_admin.
      x-permission: users.manage
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: { type: boolean }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/users/{id}/bindings:
    get:
      summary: Role bindings of a user
      x-permission: bindings.manage
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Binding" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace all role bindings of a user
      description: Dropping the last global admin binding answers 409 last_admin.
      x-permission: bindings.manage
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Binding" }
      responses:
        "204": { description: Replaced }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups:
    get:
      summary: List device groups
      x-permission: groups.manage
      responses:
        "200":
          description: Groups ordered by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a device group
      x-permission: groups.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                parent_id:
                  type: [integer, "null"]
                  format: int64
                  description: null or absent for a root group
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups/{id}:
    patch:
      summary: Rename and/or move a group; absent fields are unchanged
      x-permission: groups.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                parent_id:
                  type: [integer, "null"]
                  format: int64
                  description: null moves the group to the root
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a leaf group and the bindings scoped to it
      x-permission: groups.manage
      x-step-up: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/audit:
    get:
      summary: Audit events, newest first
      x-permission: audit.read
      parameters:
        - name: before_id
          in: query
          description: Return only events with a smaller id
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, ts, action, user_id, result, object_type, object_id]
                  properties:
                    id: { type: integer, format: int64 }
                    ts: { type: string, format: date-time }
                    action: { type: string }
                    user_id: { type: [integer, "null"], format: int64 }
                    result: { type: string, enum: [success, failure] }
                    object_type: { type: string }
                    object_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/devices:
    get:
      summary: Devices in the groups where the caller holds devices.read
      x-permission: devices.read
      x-scoped: true
      responses:
        "200":
          description: Devices ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a device to a group the caller manages
      description: A group outside the caller's scope answers 404; a used address and SNMP port 409 address_exists.
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, address, group_id]
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                address: { $ref: "#/components/schemas/DeviceAddress" }
                snmp_port: { type: integer, minimum: 1, maximum: 65535, default: 161 }
                group_id: { type: integer, format: int64 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/devices/{id}:
    get:
      summary: One device; a device outside the caller's groups answers 404
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Change device fields; absent fields are unchanged
      description: |
        A null interval falls back to the group's. Moving needs devices.manage on the target group (else 404).
        parent_id names the device whose outage suppresses this device's problems; it must be visible to
        the caller (else 404), null clears it, a cycle answers 409 parent_cycle and a chain over 16 devices
        409 parent_too_deep.
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                address: { $ref: "#/components/schemas/DeviceAddress" }
                snmp_port: { type: integer, minimum: 1, maximum: 65535 }
                group_id: { type: integer, format: int64 }
                parent_id: { type: [integer, "null"], format: int64, minimum: 1 }
                interval_avail_s: { $ref: "#/components/schemas/Interval" }
                interval_metrics_s: { $ref: "#/components/schemas/Interval" }
                interval_inventory_s: { $ref: "#/components/schemas/Interval" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a device and its credentials
      description: The disappearance of each of its links is recorded in the link change history first.
      x-permission: devices.manage
      x-step-up: true
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/profiles:
    get:
      summary: Which read credentials are set; their content is never returned
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Profiles ordered by kind
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/profiles/{kind}:
    put:
      summary: Set a read credential sealed in the browser to the read-domain key
      description: |
        The API stores the ciphertext without opening it. A key_version other
        than the current read-domain key answers 400 stale_key. snmp2c and
        telnet_read mark the device insecure_protocols.
      x-permission: device.credentials
      x-step-up: true
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ProfileKind" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SealedCredential" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a read credential
      x-permission: device.credentials
      x-step-up: true
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ProfileKind" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/poll:
    post:
      summary: Queue an immediate full poll of the device
      x-permission: devices.poll
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "202": { description: Queued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/interfaces:
    get:
      summary: "Interfaces by if_index, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryInterface" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/arp:
    get:
      summary: "ARP entries by address, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryARPEntry" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/mac:
    get:
      summary: "Forwarding database by VLAN and MAC, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryMACEntry" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/vlans:
    get:
      summary: "VLANs by id, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryVLAN" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/lldp:
    get:
      summary: "LLDP neighbors by local port, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryLLDPNeighbor" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/entities:
    get:
      summary: "Physical components (ENTITY-MIB) by index, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryEntity" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/routes:
    get:
      summary: "Routing table by destination, as last seen by the poller"
      description: Strings come from the device; render them as text only. A device outside the caller's groups answers 404.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: One page of rows
          content:
            application/json:
              schema:
                type: object
                required: [items, next_offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryRoute" }
                  next_offset:
                    type: [integer, "null"]
                    description: Offset of the next page; null on the last page
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/metrics/if:
    get:
      summary: Rate series of one interface, oldest first
      description: |
        The source (raw, 5-minute or hourly aggregates) follows the range width
        and age; step regroups the points and is raised to the source
        resolution. More than 5000 points (raw points counted at the 10 s poll
        floor) answers 400 too_many_points; a range longer than 730 days 400 bad_request.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: if_index
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: Exclusive; must be after from
          schema: { type: string, format: date-time }
        - name: step
          in: query
          description: Bucket width in seconds; absent keeps the source resolution
          schema: { type: integer, minimum: 1, maximum: 63072000 }
      responses:
        "200":
          description: Points
          content:
            application/json:
              schema:
                type: object
                required: [step_s, points]
                properties:
                  step_s: { type: integer, description: Bucket width actually used in seconds; 0 for raw points }
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/IfPoint" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/discovery/scans:
    get:
      summary: Subnet scans of the groups the caller manages
      x-permission: devices.manage
      x-scoped: true
      responses:
        "200":
          description: Scans ordered by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Schedule a subnet scan (ICMP + SNMP GET with the scan's own profile)
      description: A prefix wider than /16 (more than 65 536 addresses) answers 400 cidr_too_wide.
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cidr, group_id]
              properties:
                cidr: { type: string, examples: ["192.0.2.0/24"] }
                group_id: { type: integer, format: int64 }
                interval_s: { $ref: "#/components/schemas/ScanInterval" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/discovery/scans/{id}:
    patch:
      summary: Change scan fields; absent fields are unchanged
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                cidr: { type: string }
                group_id: { type: integer, format: int64 }
                enabled: { type: boolean }
                interval_s: { $ref: "#/components/schemas/ScanInterval" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/discovery/scans/{id}/profile:
    put:
      summary: Set the one SNMP credential the scan probes with
      description: Setting one kind removes the other. key_version as for device profiles. An enabled scan is queued for a run.
      x-permission: device.credentials
      x-step-up: true
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, ciphertext, key_version]
              properties:
                kind: { type: string, enum: [snmp2c, snmp3] }
                ciphertext: { $ref: "#/components/schemas/Ciphertext" }
                key_version: { $ref: "#/components/schemas/KeyVersion" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/discovery/inbox:
    get:
      summary: Finds of scans in the groups the caller manages, newest first
      x-permission: devices.manage
      x-scoped: true
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, ignored], default: pending }
      responses:
        "200":
          description: Discovered devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Discovered" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/discovery/inbox/{id}/accept:
    post:
      summary: Turn a pending find into a device; answers the new device id
      description: An item already handled answers 409 not_pending.
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, group_id]
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                group_id: { type: integer, format: int64 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/discovery/inbox/{id}/ignore:
    post:
      summary: Hide a pending find
      x-permission: devices.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Ignored }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/events:
    get:
      summary: Syslog and trap feed, newest first
      description: |
        Only events of devices in the caller's groups are returned; a foreign
        device_id answers 404. The window is at most 31 days (to defaults to now,
        from to a day before to); a wider or empty one answers 400 bad_request.
        q is a plain-text full-text search (words are ANDed). The cursor is opaque
        and stable for events at the same instant; repeat the filters with it.
        Syslog severity 0-1 maps to disaster, 2 high, 3 average, 4 warning,
        5-7 info; a trap no rule named has severity null and counts as info
        for severity_min. Varbinds over 16 KiB are left out. Topology rows (a link
        appeared or disappeared) need both ends visible; device_id matches either end;
        they never match q. All text comes from
        devices: render it as text only.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [syslog, trap, storm, topology] }
        - name: device_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: severity_min
          in: query
          schema: { $ref: "#/components/schemas/EventSeverity" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  next_cursor: { type: [string, "null"], description: null on the last page }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/events/unidentified:
    get:
      summary: Traps nobody could name, grouped by trap OID, newest group first
      description: Same visibility, window and cursor rules as the feed. last_* describe the newest trap of the group.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of groups
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnidentifiedTrap" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/trap-rules:
    get:
      summary: Operator-defined trap names and severities
      x-permission: events.manage
      responses:
        "200":
          description: Rules ordered by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrapRule" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Name a trap OID; eventd picks the rule up at once
      description: A second rule for the same OID answers 409 trap_rule_exists. Audited.
      x-permission: events.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trap_oid, name, severity]
              properties:
                trap_oid:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]+)*$'
                  maxLength: 2048
                  description: Dotted numeric OID without a leading dot, at most 128 sub-identifiers below 2^32
                name: { type: string, minLength: 1, maxLength: 1024, description: "No control characters, no leading or trailing spaces" }
                severity: { $ref: "#/components/schemas/TrapSeverity" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trap-rules/{id}:
    delete:
      summary: Remove a trap rule
      description: Audited.
      x-permission: events.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/ws:
    get:
      summary: Live problem feed (WebSocket upgrade)
      description: |
        Upgrades to a WebSocket. Authentication is the session cookie only (never
        a token in the URL); the Origin header must be present and equal the
        public origin, otherwise 403 csrf. At most 4 sockets per session, the 5th
        answers 429 rate_limited before the upgrade.

        Server to client (JSON text): {"type":"problem","event":"opened|acknowledged|resolved|suppressed_changed",
        "problem":ProblemSummary}, {"type":"pong"} and {"type":"subscribed","severity_min":...}.
        Only problems of devices in the caller's groups are delivered; problems
        without a device (system problems) go to global bindings only. Client
        to server, at most 1 KiB per frame: {"type":"ping"} and
        {"type":"subscribe","severity_min":"info|warning|average|high|disaster"}
        (a display preference; the scope always applies). Any other frame closes
        the socket with 1008. The server pings every 30 s and closes when no
        pong arrives within 60 s. The session and the caller's scope are
        re-checked every 30 s: the socket closes with 1008 when the session
        ended or visibility shrank, and with 1013 when the client reads too
        slowly. A request without the upgrade headers answers 426. All text
        in problems comes from devices: render it as text only.
      x-permission: devices.read
      x-scoped: true
      responses:
        "101":
          description: Switching Protocols
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/system/status:
    get:
      summary: State of the pollers, eventd, the database and the job queues
      description: |
        Pollers are derived from the devices they own. heartbeat_at is the
        poller's last heartbeat (null if it never wrote one); devices_reporting
        counts the devices with a known state (the state view hides it once a
        poller has been silent for 90 s).
      x-permission: system.read
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/problems:
    get:
      summary: Problems, newest first
      description: |
        Problems of devices in the caller's groups; problems without a device
        (system problems) are for global bindings only. A foreign device_id or
        group_id answers 404. group_id includes subgroups. suppressed=true
        returns only suppressed problems, false only the others, absent both.
        The cursor is opaque; repeat the filters with it. name, object and
        last_value may derive from devices: render them as text only.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [problem, acknowledged, resolved] }
        - name: severity_min
          in: query
          schema: { $ref: "#/components/schemas/EventSeverity" }
        - name: device_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: group_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: suppressed
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of problems
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Problem" }
                  next_cursor: { type: [string, "null"], description: null on the last page }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/problems/{id}:
    get:
      summary: One problem with its acknowledgement history
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/problems/{id}/ack:
    post:
      summary: Acknowledge a problem
      description: |
        The comment is required (1-1000 characters). The first acknowledgement
        moves the problem from problem to acknowledged and is announced on
        /api/ws (not for suppressed problems); later ones only add history
        rows. A resolved problem answers 409 problem_resolved. Audited.
      x-permission: problems.ack
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comment]
              properties:
                comment: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "204": { description: Acknowledged }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/templates:
    get:
      summary: Monitoring templates in the caller's scope
      description: Group templates of the caller's groups; driver templates only for a global binding.
      x-permission: triggers.manage
      x-scoped: true
      responses:
        "200":
          description: Templates ordered by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a template bound to a driver or to a group
      description: |
        Exactly one of driver and group_id. A driver template needs a global
        binding (a scoped caller gets 403); a group in the caller's scope is
        required for a group template (else 404). Intervals override the
        group's for the devices the template covers. A duplicate name for the
        same binding (driver or group) answers 409 template_exists; the same
        name may be used for another binding. A driver or group already at 50
        templates (for a group: the templates along its ancestor chain count
        together) answers 409 too_many_templates. Audited; the trigger engine
        reloads at once.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                driver: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$' }
                group_id: { type: integer, format: int64, minimum: 1 }
                interval_avail_s: { $ref: "#/components/schemas/Interval" }
                interval_metrics_s: { $ref: "#/components/schemas/Interval" }
                interval_inventory_s: { $ref: "#/components/schemas/Interval" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/templates/{id}:
    patch:
      summary: Rename a template or change its intervals
      description: The binding cannot change (delete and create instead). A null interval clears it. Audited.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
                interval_avail_s: { $ref: "#/components/schemas/Interval" }
                interval_metrics_s: { $ref: "#/components/schemas/Interval" }
                interval_inventory_s: { $ref: "#/components/schemas/Interval" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a template with its triggers and their overrides
      description: The engine resolves the open problems of the removed triggers. Audited.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/templates/{id}/triggers:
    get:
      summary: Triggers of a template
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Triggers ordered by id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trigger" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Add a trigger to a template
      description: |
        The kind is a closed set and params are validated per kind (see the
        TriggerParams schema); invalid ones answer 400 invalid_trigger. Params
        are stored re-encoded from the parsed value. A template already at 100
        triggers answers 409 too_many_triggers; a syslog trigger that would
        make more than 256 distinct (severity_min, contains) filters (contains
        compared case-insensitively, per-device overrides included) answers
        409 too_many_filters. Audited; the engine reloads at once.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, params, duration_s, severity, name]
              properties:
                kind: { $ref: "#/components/schemas/TriggerKind" }
                params: { $ref: "#/components/schemas/TriggerParams" }
                duration_s: { type: integer, minimum: 0, maximum: 86400 }
                severity: { $ref: "#/components/schemas/EventSeverity" }
                enabled: { type: boolean, default: true }
                name: { $ref: "#/components/schemas/GroupName" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/templates/{id}/triggers/{trigger_id}:
    patch:
      summary: Change a trigger; the kind is fixed
      description: params are validated against the stored kind. A change that would exceed the limit of 256 distinct syslog filters answers 409 too_many_filters. Audited.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/TriggerId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                params: { $ref: "#/components/schemas/TriggerParams" }
                duration_s: { type: integer, minimum: 0, maximum: 86400 }
                severity: { $ref: "#/components/schemas/EventSeverity" }
                enabled: { type: boolean }
                name: { $ref: "#/components/schemas/GroupName" }
      responses:
        "204": { description: Updated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a trigger with its overrides
      description: The engine resolves its open problems. Audited.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/TriggerId" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/trigger-overrides:
    get:
      summary: Per-trigger exceptions of a device
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Overrides ordered by trigger id
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TriggerOverride" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/devices/{id}/trigger-overrides/{trigger_id}:
    put:
      summary: Set the device's exception to a trigger (replaces any earlier one)
      description: |
        The device must be in the caller's scope and the trigger must apply to
        it (its template bound to the device's driver or to the device's group
        or an ancestor), else 404. At least one of enabled, severity and params
        is required. params lay keys over the trigger's (null removes an
        optional key); the merged result must be a valid condition, else 400
        invalid_trigger. Only keys that differ from the trigger are stored.
        A caller whose scope does not cover the trigger's template gets 404
        (not invalid_trigger) for params that do not validate, so the kind
        stays hidden. An override of a syslog trigger that would make more
        than 256 distinct filters answers 409 too_many_filters. Audited; the
        engine reloads at once.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/TriggerId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: { type: boolean }
                severity: { $ref: "#/components/schemas/EventSeverity" }
                params: { type: object, additionalProperties: true, description: "Keys of the trigger's params to override" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the device's exception to a trigger
      description: Audited.
      x-permission: triggers.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/TriggerId" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/maintenance:
    get:
      summary: Maintenance windows of the caller's groups
      description: Windows that have not ended, newest start first; include_ended=true adds the finished ones (at most 1000 rows).
      x-permission: maintenance.manage
      x-scoped: true
      parameters:
        - name: include_ended
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Windows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceWindow" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Open a maintenance window for a group
      description: |
        Problems of the group's devices (subgroups included) open suppressed
        while it lasts. The group must be in the caller's scope (else 404). The
        window may have started already but must end in the future, after it
        starts, and last at most 7 days, else 400 invalid_window. A group with
        100 windows that have not ended answers 409 too_many_windows. Audited;
        the engine reloads at once.
      x-permission: maintenance.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_id, starts_at, ends_at]
              properties:
                group_id: { type: integer, format: int64, minimum: 1 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                comment: { type: string, maxLength: 1000 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/maintenance/{id}:
    delete:
      summary: End a maintenance window early by removing it
      description: Audited. The suppression it caused is released.
      x-permission: maintenance.manage
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/topology:
    get:
      summary: Nodes, links and areas for the map
      description: |
        Only devices the caller can see (devices.read, subgroups included) are
        nodes; a link is returned only if both of its ends are visible, and the
        summary status of an area counts visible devices only. group_id narrows
        the nodes to that group and its subgroups (404 for a group the caller
        cannot see or that does not exist); links then need both ends inside it.
        view_id adds the stored positions (x, y, pinned), the areas of the view
        and the area of each node: the smallest area whose rectangle contains the
        node's position (a node without a position has none); without view_id
        areas is empty. Views and areas are global admin-entered objects whose
        names every devices.read holder sees; they are not device data. The area
        status is the worst state of the visible devices in it and its sub-areas
        (down, partial, unknown, up; an area without visible devices is unknown).
        Link ends are in canonical order (a < b). Port names come from the
        devices' interface tables (name, else alias): render as text only.
        speed_bps is the lower known speed of the two ends. Link utilisation is
        not part of this response; read it per interface from the metrics
        endpoint.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - name: view_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: group_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The topology
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topology" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/topology/changes:
    get:
      summary: Link appearances and disappearances, newest first
      description: |
        A change is visible when both ends are visible to the caller; one whose
        device has been deleted since is visible only to a global binding (its
        name is then empty). The same rows are in GET /api/events as kind
        topology. The cursor is opaque; repeat limit with it.
      x-permission: devices.read
      x-scoped: true
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of changes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LinkChange" }
                  next_cursor: { type: [string, "null"], description: null on the last page }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/links:
    post:
      summary: Draw a manual link
      description: |
        A manual link has confidence 1 and is never changed or removed by the
        builder; it suppresses automatic links over the same cable. Both devices
        must be visible to the caller (else 404). Ports are optional (unknown);
        the ends are stored in canonical order whatever order is sent. Writes a
        link change "appeared" (source manual) in the same transaction, is
        audited, and the builder reloads. 409 link_exists for an identical manual
        link, 409 too_many_links at 64 links between the pair. A detected link with
        exactly the same ends (unknown ports match unknown ports only) is not a
        duplicate: that row becomes the manual link (same id, confidence 1) and the
        id is returned with 201; no change is written since it already appeared, and
        the audit record carries converted_from (its former source).
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [a_device_id, b_device_id]
              properties:
                a_device_id: { type: integer, format: int64, minimum: 1 }
                a_if_index: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
                b_device_id: { type: integer, format: int64, minimum: 1 }
                b_if_index: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/links/{id}:
    delete:
      summary: Remove a manual link
      description: |
        Only manual links; an automatic link, a missing one and one with an end
        the caller cannot see all answer 404. Writes a link change "disappeared"
        (source manual) in the same transaction and is audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/map/views:
    get:
      summary: Map views
      description: At most 100. Views are global objects; every devices.read holder sees them.
      x-permission: devices.read
      x-scoped: true
      responses:
        "200":
          description: Views
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapView" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a map view
      description: At most 100 views (409 too_many_views). A background_id that does not exist answers 400. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [logical, plan] }
                background_id: { type: [integer, "null"], format: int64, minimum: 1 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/map/views/{id}:
    patch:
      summary: Change a map view
      description: |
        Only the given fields change; background_id null removes the background. At least one field is required.
        A background that no other view uses any more is deleted in the same transaction (the audit record
        carries deleted_background_id). Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [logical, plan] }
                background_id: { type: [integer, "null"], format: int64, minimum: 1 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a map view with its areas and node positions
      description: Its background is deleted too when no other view uses it. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/map/views/{id}/areas:
    get:
      summary: Areas of a view
      description: Geometry only; the summary status per area is part of GET /api/topology. At most 2000.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Areas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapArea" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an area
      description: |
        Areas nest to at most 8 levels and the parent must be in the same view
        (409 area_other_view; a parent that does not exist is reported the same
        way), without cycles (409 area_cycle; 409 area_too_deep). At most 2000
        areas per view (409 too_many_areas). Coordinates are within +-1e6, w and
        h positive and at most 1e6. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, name, x, y, w, h]
              properties:
                parent_id: { type: [integer, "null"], format: int64, minimum: 1 }
                kind: { $ref: "#/components/schemas/MapAreaKind" }
                name: { type: string, minLength: 1, maxLength: 200 }
                x: { type: number, minimum: -1000000, maximum: 1000000 }
                y: { type: number, minimum: -1000000, maximum: 1000000 }
                w: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
                h: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/map/views/{id}/areas/{area_id}:
    patch:
      summary: Change an area
      description: Only the given fields change; parent_id null makes the area a root. The view of an area never changes. Same parent errors as on create. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/AreaId" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parent_id: { type: [integer, "null"], format: int64, minimum: 1 }
                kind: { $ref: "#/components/schemas/MapAreaKind" }
                name: { type: string, minLength: 1, maxLength: 200 }
                x: { type: number, minimum: -1000000, maximum: 1000000 }
                y: { type: number, minimum: -1000000, maximum: 1000000 }
                w: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
                h: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an area
      description: Its sub-areas become roots of the view. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/AreaId" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/map/views/{id}/positions:
    put:
      summary: Store node positions of a view in one batch
      description: |
        1 to 5000 items, all or nothing: a device the caller cannot see or that
        does not exist answers 404 for the whole batch and nothing is written; a
        repeated device or a coordinate outside +-1e6 answers 400. An existing
        position is replaced as sent (send pinned=false to unpin). Audited with
        counts only.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    additionalProperties: false
                    required: [device_id, x, y, pinned]
                    properties:
                      device_id: { type: integer, format: int64, minimum: 1 }
                      x: { type: number, minimum: -1000000, maximum: 1000000 }
                      y: { type: number, minimum: -1000000, maximum: 1000000 }
                      pinned: { type: boolean }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/map/backgrounds:
    post:
      summary: Upload a map background
      description: |
        multipart/form-data with exactly one part named `file` (file name up to 200 characters). The type is taken
        from the content only: PNG, JPEG, WebP (header checked, at most 16384 x 16384 pixels) or SVG (rewritten through
        an allowlist of elements and attributes; what is stored and served is the sanitized document). At most 20 MiB;
        this is the only route whose request body may exceed 1 MiB. Immutable once stored; at most 200 backgrounds
        (409 too_many_backgrounds). Uploads are processed one at a time; a second one waits up to 10 s, then 429.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, mime, width, height, size, sha256]
                properties:
                  id: { type: integer, format: int64 }
                  mime: { type: string, enum: [image/png, image/jpeg, image/webp, image/svg+xml] }
                  width: { type: integer, minimum: 1, maximum: 16384 }
                  height: { type: integer, minimum: 1, maximum: 16384 }
                  size: { type: integer, description: "Stored bytes (the sanitized document for SVG)" }
                  sha256: { type: string, description: "Hex digest of the stored bytes (the ETag)" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/map/backgrounds/{id}:
    get:
      summary: Download a map background
      description: |
        Backgrounds are admin objects shown under maps, so any devices.read holder may fetch one. The response
        carries the stored type, `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; sandbox`,
        `X-Content-Type-Options: nosniff`, `Content-Disposition: inline`, `Cache-Control: private, max-age=3600`
        and a sha256 ETag (If-None-Match answers 304 without reading the image). The body is streamed in 1 MiB
        pieces; at most 4 downloads stream at a time, a further one waits about 1 s and then gets 503 busy with
        Retry-After. Use it only as an `<img src>`.
      x-permission: devices.read
      x-scoped: true
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304": { description: Not modified }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a map background
      description: |
        Views that use it fall back to no background. Unused backgrounds are also deleted automatically when
        the last view using one drops it or is deleted, so this is for backgrounds that were uploaded but
        never assigned. Audited.
      x-permission: map.manage
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-nms_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ProfileKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [snmp2c, snmp3, ssh_read, telnet_read] }
    AreaId:
      name: area_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TriggerId:
      name: trigger_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  headers:
    SessionCookie:
      description: "__Host-nms_session=<token>; Path=/; HttpOnly; Secure; SameSite=Strict"
      schema: { type: string }
  requestBodies:
    ChallengeCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge, code]
            properties:
              challenge: { type: string }
              code: { type: string }
  responses:
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: { type: integer, format: int64 }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Problem:
      allOf:
        - $ref: "#/components/schemas/ProblemSummary"
        - type: object
          required: [trigger_id, resolve_reason, last_value]
          properties:
            trigger_id: { type: [integer, "null"], format: int64, description: null for a system problem }
            resolve_reason: { type: [string, "null"], description: "recovered, removed or null while open" }
            last_value: { type: [string, "null"], description: "Last observed value; comes from devices, render as text only" }
    ProblemDetail:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [acks]
          properties:
            acks:
              type: array
              description: Acknowledgement history, oldest first
              items:
                type: object
                required: [id, user_id, username, comment, at]
                properties:
                  id: { type: integer, format: int64 }
                  user_id: { type: integer, format: int64 }
                  username: { type: [string, "null"] }
                  comment: { type: string }
                  at: { type: string, format: date-time }
    Template:
      type: object
      required: [id, name, driver, group_id, interval_avail_s, interval_metrics_s, interval_inventory_s]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        driver: { type: [string, "null"] }
        group_id: { type: [integer, "null"], format: int64 }
        interval_avail_s: { type: [integer, "null"] }
        interval_metrics_s: { type: [integer, "null"] }
        interval_inventory_s: { type: [integer, "null"] }
    TriggerKind:
      type: string
      enum: [availability, if_oper_down, metric_threshold, trap, syslog]
    TriggerParams:
      type: object
      description: |
        Per kind, no other keys. availability {states: [down|partial, ...]};
        if_oper_down {if_index?: 1..2147483647}; metric_threshold {metric:
        cpu|mem|temp|if_util_in|if_util_out|if_errors, op: gt|lt, value
        (cpu, mem, if_util_* 0..100; temp -50..150; if_errors >= 0),
        if_index? (interface metrics only)}; trap {name: 1-1024 bytes};
        syslog {severity_min: 0..7 (0 most severe), contains?: 1-128
        characters, case-insensitive}.
      additionalProperties: true
    Trigger:
      type: object
      required: [id, template_id, kind, params, duration_s, severity, enabled, name]
      properties:
        id: { type: integer, format: int64 }
        template_id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/TriggerKind" }
        params: { $ref: "#/components/schemas/TriggerParams" }
        duration_s: { type: integer, minimum: 0, maximum: 86400 }
        severity: { $ref: "#/components/schemas/EventSeverity" }
        enabled: { type: boolean }
        name: { type: string }
    TriggerOverride:
      type: object
      required: [trigger_id, enabled, params, severity]
      properties:
        trigger_id: { type: integer, format: int64 }
        enabled: { type: [boolean, "null"], description: "null: as in the trigger" }
        params: { type: [object, "null"], additionalProperties: true, description: Overridden keys only }
        severity: { oneOf: [{ $ref: "#/components/schemas/EventSeverity" }, { type: "null" }] }
    MaintenanceWindow:
      type: object
      required: [id, group_id, group_name, starts_at, ends_at, comment]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64 }
        group_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        comment: { type: string }
    User:
      type: object
      required: [id, username, disabled, totp_enrolled]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        disabled: { type: boolean }
        totp_enrolled: { type: boolean }
    Binding:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [viewer, operator, admin, auditor] }
        group_id:
          type: [integer, "null"]
          format: int64
          description: null or absent for a global binding
    Group:
      type: object
      required: [id, parent_id, name]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: [integer, "null"], format: int64 }
        name: { type: string }
    GroupName:
      type: string
      minLength: 1
      maxLength: 200
      description: No control characters, no leading or trailing spaces
    Device:
      type: object
      required: [id, name, address, group_id, driver, model, firmware, insecure_protocols, state, state_since]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        group_id: { type: integer, format: int64 }
        driver: { type: string }
        model: { type: string, description: Reported by the device; render as text only }
        firmware: { type: string, description: Reported by the device; render as text only }
        insecure_protocols: { type: boolean, description: An SNMPv2c or telnet credential is set }
        state: { type: string, enum: [up, partial, down, unknown] }
        state_since: { type: [string, "null"], format: date-time }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          required: [snmp_port, parent_id, interval_avail_s, interval_metrics_s, interval_inventory_s, last_error]
          properties:
            snmp_port: { type: integer }
            parent_id: { type: [integer, "null"], format: int64, description: The device whose outage suppresses this one's problems }
            last_error: { type: string, description: Fixed text of the poller why the device is not up; empty if none }
            interval_avail_s: { type: [integer, "null"], description: null inherits from the group }
            interval_metrics_s: { type: [integer, "null"] }
            interval_inventory_s: { type: [integer, "null"] }
    EventSeverity:
      type: string
      enum: [info, warning, average, high, disaster]
    ProblemSummary:
      type: object
      required: [id, device_id, device_name, group_id, severity, state, suppressed, name, system_kind, object, opened_at, acknowledged_at, resolved_at]
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64, nullable: true }
        device_name: { type: string }
        group_id: { type: integer, format: int64, nullable: true }
        severity: { $ref: "#/components/schemas/EventSeverity" }
        state: { type: string, enum: [problem, acknowledged, resolved] }
        suppressed: { type: boolean }
        name: { type: string }
        system_kind: { type: [string, "null"], description: "Set for engine-raised problems, e.g. poller_unavailable; the UI translates their title by it" }
        object: { type: string }
        opened_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
    TrapSeverity:
      type: string
      enum: [info, warning, average, high, disaster]
    Event:
      type: object
      required: [ts, kind, device_id, device_name, severity, text, identified]
      description: Everything but the ids and the kind comes from the device; render as text only
      properties:
        ts: { type: string, format: date-time }
        kind: { type: string, enum: [syslog, trap, storm, topology], description: "storm: events a source sent above its rate limit, folded per minute; topology: a link appeared or disappeared (name is appeared or disappeared, text is the device and port names of both ends, device_id is end A, severity info or warning)" }
        device_id: { type: integer, format: int64 }
        device_name: { type: string }
        severity:
          oneOf:
            - { $ref: "#/components/schemas/EventSeverity" }
            - { type: "null" }
        name: { type: string, description: "Trap name (traps), or appeared/disappeared (topology)" }
        app: { type: string, description: Syslog application (syslog only) }
        text: { type: string, description: "Syslog message, the trap OID, or the folded kind (syslog or trap) of a storm row" }
        count: { type: integer, format: int64, description: "Storm rows only: number of events folded into the row; ts is the minute" }
        identified: { type: boolean, description: Always true for syslog }
        varbinds: { description: Trap varbinds as received (traps only; omitted over 16 KiB) }
        varbinds_omitted: { type: boolean, description: "True when the varbinds were left out because they exceed 16 KiB" }
    UnidentifiedTrap:
      type: object
      required: [trap_oid, count, last_ts, last_device_id, last_device_name]
      properties:
        trap_oid: { type: string }
        count: { type: integer, format: int64 }
        last_ts: { type: string, format: date-time }
        last_device_id: { type: integer, format: int64 }
        last_device_name: { type: string }
        last_varbinds: { description: Varbinds of the newest trap (omitted over 16 KiB) }
        last_varbinds_omitted: { type: boolean, description: "True when last_varbinds were left out because they exceed 16 KiB" }
    TrapRule:
      type: object
      required: [id, trap_oid, name, severity, created_at]
      properties:
        id: { type: integer, format: int64 }
        trap_oid: { type: string }
        name: { type: string }
        severity: { $ref: "#/components/schemas/TrapSeverity" }
        created_at: { type: string, format: date-time }
    SystemStatus:
      type: object
      required: [now, pollers, eventd, db_size_bytes, queues]
      properties:
        now: { type: string, format: date-time, description: "Server time of the report; compare updated_at against it, not the browser clock" }
        pollers:
          type: array
          items:
            type: object
            required: [id, devices, devices_reporting, heartbeat_at]
            properties:
              id: { type: string }
              devices: { type: integer, format: int64 }
              devices_reporting: { type: integer, format: int64 }
              heartbeat_at: { type: [string, "null"], format: date-time }
        eventd:
          type: array
          items:
            type: object
            required: [instance, updated_at, received, accepted, unknown_source, auth_failed, rate_limited, dropped, queue_depth]
            properties:
              instance: { type: string }
              updated_at: { type: string, format: date-time }
              received: { type: integer, format: int64 }
              accepted: { type: integer, format: int64 }
              unknown_source: { type: integer, format: int64 }
              auth_failed: { type: integer, format: int64 }
              rate_limited: { type: integer, format: int64 }
              dropped: { type: integer, format: int64 }
              queue_depth: { type: integer }
        db_size_bytes: { type: integer, format: int64 }
        queues:
          type: array
          items:
            type: object
            required: [name, available, running, retryable]
            properties:
              name: { type: string }
              available: { type: integer, format: int64 }
              running: { type: integer, format: int64 }
              retryable: { type: integer, format: int64 }
    DeviceAddress:
      type: string
      description: IPv4 or IPv6 unicast host address; loopback, multicast, broadcast and unspecified are refused
      examples: ["192.0.2.10"]
    Interval:
      type: [integer, "null"]
      minimum: 10
      maximum: 86400
      description: Seconds; null falls back to the group's interval
    ScanInterval:
      type: integer
      minimum: 300
      maximum: 2592000
      default: 86400
      description: Seconds between scans
    Profile:
      type: object
      required: [kind, status, updated_at]
      properties:
        kind: { type: string, enum: [snmp2c, snmp3, ssh_read, telnet_read] }
        status: { type: string, enum: [pending, ok, invalid, weak, mismatch] }
        updated_at: { type: string, format: date-time }
    Ciphertext:
      type: string
      contentEncoding: base64
      description: Sealed box to the read-domain key, at most 8240 bytes decoded; never opened by the API
    KeyVersion:
      type: integer
      minimum: 1
      description: key_version of the read domain in keys.json
    SealedCredential:
      type: object
      additionalProperties: false
      required: [ciphertext, key_version]
      properties:
        ciphertext: { $ref: "#/components/schemas/Ciphertext" }
        key_version: { $ref: "#/components/schemas/KeyVersion" }
    Scan:
      type: object
      required: [id, cidr, group_id, enabled, interval_s, last_run_at]
      properties:
        id: { type: integer, format: int64 }
        cidr: { type: string }
        group_id: { type: integer, format: int64 }
        enabled: { type: boolean }
        interval_s: { type: integer }
        last_run_at: { type: [string, "null"], format: date-time }
    Discovered:
      type: object
      required: [id, scan_id, group_id, address, sys_object_id, sys_descr, sys_name, found_at, status]
      properties:
        id: { type: integer, format: int64 }
        scan_id: { type: integer, format: int64 }
        group_id: { type: integer, format: int64, description: Group of the scan that found it }
        address: { type: string }
        sys_object_id: { type: string, description: Reported by the device; render as text only }
        sys_descr: { type: string, description: Reported by the device; render as text only }
        sys_name: { type: string, description: Reported by the device; render as text only }
        found_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, ignored] }
    InventoryInterface:
      type: object
      required: [if_index, name, alias, speed_bps, oper_up, seen_at]
      properties:
        if_index: { type: integer }
        name: { type: string, description: Reported by the device; render as text only }
        alias: { type: string, description: Reported by the device; render as text only }
        speed_bps: { type: integer, format: int64 }
        oper_up: { type: boolean }
        seen_at: { type: string, format: date-time }
    InventoryARPEntry:
      type: object
      required: [ip, mac, if_index, seen_at]
      properties:
        ip: { type: string }
        mac: { type: string, examples: ["00:11:22:33:44:55"] }
        if_index: { type: integer }
        seen_at: { type: string, format: date-time }
    InventoryMACEntry:
      type: object
      required: [mac, vlan, if_index, seen_at]
      properties:
        mac: { type: string }
        vlan: { type: integer, description: 0 when unknown }
        if_index: { type: integer }
        seen_at: { type: string, format: date-time }
    InventoryVLAN:
      type: object
      required: [vlan_id, name, seen_at]
      properties:
        vlan_id: { type: integer }
        name: { type: string, description: Reported by the device; render as text only }
        seen_at: { type: string, format: date-time }
    InventoryLLDPNeighbor:
      type: object
      required: [local_if_index, chassis_id, port_id, sys_name, mgmt_addr, seen_at]
      properties:
        local_if_index: { type: integer }
        chassis_id: { type: string, description: Reported by the neighbor; render as text only }
        port_id: { type: string, description: Reported by the neighbor; render as text only }
        sys_name: { type: string, description: Reported by the neighbor; render as text only }
        mgmt_addr: { type: [string, "null"] }
        seen_at: { type: string, format: date-time }
    InventoryEntity:
      type: object
      required: [ent_index, class, name, model, serial, seen_at]
      properties:
        ent_index: { type: integer }
        class: { type: string }
        name: { type: string, description: Reported by the device; render as text only }
        model: { type: string, description: Reported by the device; render as text only }
        serial: { type: string, description: Reported by the device; render as text only }
        seen_at: { type: string, format: date-time }
    InventoryRoute:
      type: object
      required: [dest, next_hop, if_index, proto, seen_at]
      properties:
        dest: { type: string, examples: ["10.0.0.0/8"] }
        next_hop: { type: [string, "null"] }
        if_index: { type: integer }
        proto: { type: string }
        seen_at: { type: string, format: date-time }
    IfPoint:
      type: object
      required: [ts, in_bps, in_bps_max, out_bps, out_bps_max, in_err_ps, out_err_ps, in_disc_ps, out_disc_ps, oper_up, speed_bps]
      properties:
        ts: { type: string, format: date-time }
        in_bps: { type: number }
        in_bps_max: { type: number, description: Peak inside the bucket }
        out_bps: { type: number }
        out_bps_max: { type: number }
        in_err_ps: { type: [number, "null"], description: null when the device did not report it }
        out_err_ps: { type: [number, "null"] }
        in_disc_ps: { type: [number, "null"] }
        out_disc_ps: { type: [number, "null"] }
        oper_up: { type: boolean }
        speed_bps: { type: integer, format: int64 }
    MapAreaKind:
      type: string
      enum: [organization, building, floor, room]
    MapView:
      type: object
      required: [id, name, kind, background_id]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string, enum: [logical, plan] }
        background_id: { type: [integer, "null"], format: int64 }
    MapArea:
      type: object
      required: [id, parent_id, kind, name, x, y, w, h]
      properties:
        id: { type: integer, format: int64 }
        parent_id: { type: [integer, "null"], format: int64 }
        kind: { $ref: "#/components/schemas/MapAreaKind" }
        name: { type: string }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    TopologyNode:
      type: object
      required: [device_id, name, state, driver, pinned]
      properties:
        device_id: { type: integer, format: int64 }
        name: { type: string }
        state: { type: string, enum: [up, partial, down, unknown] }
        driver: { type: string }
        area_id: { type: integer, format: int64, description: "Smallest area of the requested view whose rectangle contains the position; absent without view_id or position" }
        x: { type: number, description: Present with view_id when the node has a position }
        y: { type: number }
        pinned: { type: boolean }
    TopologyLink:
      type: object
      required: [id, a, b, a_if, b_if, a_port_name, b_port_name, speed_bps, source, confidence, manual]
      properties:
        id: { type: integer, format: int64 }
        a: { type: integer, format: int64, description: Device id; always smaller than b }
        b: { type: integer, format: int64 }
        a_if: { type: [integer, "null"], description: ifIndex on a; null when unknown }
        b_if: { type: [integer, "null"] }
        a_port_name: { type: string, description: "Interface name, else alias, else empty; from the device, render as text only" }
        b_port_name: { type: string }
        speed_bps: { type: [integer, "null"], format: int64, description: Lower known speed of the two ends }
        source: { type: string, enum: [lldp, cdp, mac, manual] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        manual: { type: boolean }
    TopologyArea:
      allOf:
        - $ref: "#/components/schemas/MapArea"
        - type: object
          required: [device_count, states, status]
          properties:
            device_count: { type: integer, description: Visible devices in the area and its sub-areas }
            states:
              type: object
              required: [up, partial, down, unknown]
              properties:
                up: { type: integer }
                partial: { type: integer }
                down: { type: integer }
                unknown: { type: integer }
            status: { type: string, enum: [up, partial, down, unknown], description: "Worst state of the visible devices in the area" }
    Topology:
      type: object
      required: [nodes, links, areas]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TopologyNode" }
        links:
          type: array
          items: { $ref: "#/components/schemas/TopologyLink" }
        areas:
          type: array
          items: { $ref: "#/components/schemas/TopologyArea" }
    LinkChange:
      type: object
      required: [id, at, change, source, link_id, a_device_id, a_device_name, a_if_index, a_port_name, b_device_id, b_device_name, b_if_index, b_port_name]
      description: Names come from the devices and their interface tables; render as text only
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        change: { type: string, enum: [appeared, disappeared] }
        source: { type: string, enum: [lldp, cdp, mac, manual] }
        link_id: { type: [integer, "null"], format: int64, description: The link may be gone by now }
        a_device_id: { type: integer, format: int64 }
        a_device_name: { type: string, description: Empty when the device was deleted }
        a_if_index: { type: [integer, "null"] }
        a_port_name: { type: string }
        b_device_id: { type: integer, format: int64 }
        b_device_name: { type: string }
        b_if_index: { type: [integer, "null"] }
        b_port_name: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthenticated
                - invalid_credentials
                - challenge_expired
                - session_expired
                - csrf
                - forbidden
                - stepup_required
                - not_found
                - method_not_allowed
                - payload_too_large
                - unsupported_media_type
                - user_exists
                - group_exists
                - group_not_empty
                - group_cycle
                - last_admin
                - invalid_username
                - weak_password
                - invalid_role
                - address_exists
                - not_pending
                - stale_key
                - cidr_too_wide
                - trap_rule_exists
                - problem_resolved
                - template_exists
                - invalid_trigger
                - invalid_window
                - parent_cycle
                - parent_too_deep
                - link_exists
                - too_many_links
                - too_many_views
                - too_many_areas
                - area_cycle
                - area_too_deep
                - area_other_view
                - unsupported_media
                - invalid_image
                - too_many_backgrounds
                - too_many_triggers
                - too_many_templates
                - too_many_filters
