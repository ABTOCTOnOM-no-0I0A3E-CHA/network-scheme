# Reference topology of test/fixtures/snmp/topology-*.snmprec.
# Read by internal/topology (TestReferenceTopology) and test/e2e/map.spec.ts; keep the layout simple
# (two-space list items, "key: value" lines), the e2e reads it with a small parser.
#
# devices: name and address as registered (address = the simulator container in CI), fixture = data file,
#          community = the SNMPv2c community the CI simulator answers with (the data file name).
# links:   ports are interface names; confidence is the builder's value (1 mutual LLDP, 0.5 one side
#          only, 0.4 inferred from MAC tables); the builder must produce exactly these links.
devices:
  - name: topo-a
    address: 172.30.1.201
    fixture: topology-a
    community: e2e-topology-a-community
  - name: topo-b
    address: 172.30.1.202
    fixture: topology-b
    community: e2e-topology-b-community
  - name: topo-c
    address: 172.30.1.203
    fixture: topology-c
    community: e2e-topology-c-community
  - name: topo-d
    address: 172.30.1.204
    fixture: topology-d
    community: e2e-topology-d-community
links:
  - a: topo-a
    a_port: Gi1/0/1
    b: topo-b
    b_port: Gi1/0/1
    source: lldp
    confidence: 1.0
  - a: topo-a
    a_port: Gi1/0/2
    b: topo-c
    b_port: Gi1/0/4
    source: lldp
    confidence: 1.0
  - a: topo-a
    a_port: Gi1/0/3
    b: topo-d
    b_port: Gi1/0/1
    source: lldp
    confidence: 0.5
  - a: topo-b
    a_port: Gi1/0/3
    b: topo-d
    b_port: Gi1/0/2
    source: mac
    confidence: 0.4
