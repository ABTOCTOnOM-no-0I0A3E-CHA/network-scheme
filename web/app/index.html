<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- input-otp injects a runtime style element unless an element with this id exists; the CSP blocks it, index.css carries the rules -->
    <meta id="input-otp-style" />
    <!-- Cytoscape does the same with this id (a style element for its container class); the map host is positioned by classes -->
    <meta id="__________cytoscape_stylesheet" />
    <!-- react-draggable (dashboard grid) likewise adds a selection style element on drag unless this id exists -->
    <meta id="react-draggable-style-el" />
    <title>Network Scheme</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
