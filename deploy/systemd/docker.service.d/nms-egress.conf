# Installed by nmsctl install. Docker starts only after the egress rules of the
# devices network (/etc/nms/config/egress.yaml) are in DOCKER-USER: if
# "nmsctl egress apply" fails, Docker does not start and no container runs
# unfiltered. Once started, Docker must forward through DOCKER-USER, else it is
# stopped again ("nmsctl egress check").
[Service]
ExecStartPre=/usr/local/bin/nmsctl egress apply
ExecStartPost=/usr/local/bin/nmsctl egress check
