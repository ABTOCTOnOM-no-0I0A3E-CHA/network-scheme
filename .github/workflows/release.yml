name: release

# Builds the UNSIGNED update bundle and the host nmsctl from a tag. No secrets: the maintainer
# signs the bundle offline (scripts/sign-bundle.sh) and publishes it with its .minisig.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build images
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker build -t "nms/api:$tag" -f deploy/docker/api.Dockerfile .
          docker build -t "nms/gateway:$tag" -f deploy/docker/gateway.Dockerfile .
          docker build -t "nms/executor:$tag" -f deploy/docker/executor.Dockerfile .
      - name: Bundle (unsigned)
        run: scripts/build-bundle.sh "${GITHUB_REF_NAME#v}" dist
      - name: Host nmsctl
        # The release public key is a repository variable (public, not a secret); without it nmsctl refuses every bundle.
        env:
          RELEASE_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          [ -n "$RELEASE_KEY" ] || { echo "set the repository variable MINISIGN_PUBLIC_KEY" >&2; exit 1; }
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.releaseKey=$RELEASE_KEY" -o dist/nmsctl ./cmd/nmsctl
          (cd dist && sha256sum nms-*.tar nmsctl > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unsigned
          path: dist/
