name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check
        run: scripts/check.sh
      - name: Race detector
        run: |
          go test -race ./internal/poller/... ./internal/metrics/... ./internal/ssh/... ./internal/snmp/... ./internal/jobs/...
          # -short: the 5 000 events/s throughput test measures speed, which the race detector distorts
          go test -race -short ./internal/eventd/...
      - name: Isolation check detects violations
        run: "! scripts/check-isolation.sh test/fixtures/isolation"
      - name: eventd (network-facing) has no write code
        run: |
          go list -deps ./cmd/eventd | grep -c . # the list is not empty
          ! go list -deps ./cmd/eventd | tr -d '\r' | grep -F '/cmd/executor'

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Install tools
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Go licenses
        run: scripts/check-licenses.sh go .
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web/app
      - name: JS licenses
        run: scripts/check-licenses.sh js web/app
      - name: Install e2e dependencies
        run: bun install --frozen-lockfile
        working-directory: test/e2e
      - name: JS licenses (e2e)
        run: scripts/check-licenses.sh js test/e2e
      - name: JS license check accepts a clean fixture
        run: scripts/check-licenses.sh js test/fixtures/licenses/js-clean
      - name: License check detects violations
        run: |
          scripts/expect-license-failure.sh js test/fixtures/licenses/js-gpl evil-dep
          scripts/expect-license-failure.sh js test/fixtures/licenses/js-private-gpl sneaky-dep
          scripts/expect-license-failure.sh go test/fixtures/licenses/go-gpl example.com/gpldep

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Vulnerability scan
        run: osv-scanner --recursive .

  # 1 000 devices as in-process SNMPv2c agents (one loopback UDP port each), the poller
  # with production defaults for 10 minutes: p95 of the availability start delay must stay within 30 s.
  load:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags load ./test/load/
      - name: Load test
        run: go test -tags load ./test/load/ -run . -v -count=1 -timeout 30m

  # Real install on a fresh runner, login through the browser, a simulated device polled
  # end to end, zero egress, egress rules of the devices network, ZAP baseline.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_DIR: /tmp/nms-e2e
      COMPOSE: /etc/nms/compose.yaml
      # The default devices subnet; the simulator lives there, so it is the management subnet too.
      DEVICES_SUBNET: 172.30.1.0/24
      # A second management subnet: the veth of the off-host-like event sender (network namespace nms-ev-mgmt).
      MGMT_EXTRA: 172.31.250.0/24
      SNMPSIM: nms-e2e-snmpsim
      INSTALL_ARGS: >-
        --non-interactive --public-host localhost --admin-user admin
        --admin-password-file /tmp/nms-e2e/admin-password --image-tag ci
        --mgmt-subnet 172.30.1.0/24 --mgmt-subnet 172.31.250.0/24
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Disable the docker userland-proxy
        run: |
          cfg=/etc/docker/daemon.json
          { sudo cat "$cfg" 2>/dev/null || echo '{}'; } | jq '. + {"userland-proxy": false}' > /tmp/daemon.json
          sudo install -m 0644 /tmp/daemon.json "$cfg"
          sudo systemctl restart docker
          docker version --format '{{.Server.Version}}'
      - name: Build images
        run: |
          docker build -t nms/api:ci -f deploy/docker/api.Dockerfile .
          docker build -t nms/gateway:ci -f deploy/docker/gateway.Dockerfile .
          docker build -t nms-snmpsim:ci test/sim/snmpsim
      - name: Build nmsctl
        run: |
          CGO_ENABLED=0 go build -trimpath -o nmsctl ./cmd/nmsctl
          sudo install -m 0755 nmsctl /usr/local/bin/nmsctl
      - name: nmsctl install
        run: |
          install -d -m 0700 "$E2E_DIR"
          head -c 24 /dev/urandom | base64 | tr -d '/+=' > "$E2E_DIR/admin-password"
          # The log holds the admin's TOTP QR, secret and backup codes: print only the summary.
          if ! sudo /usr/local/bin/nmsctl install $INSTALL_ARGS --totp-secret-out "$E2E_DIR/totp-secret" > "$E2E_DIR/install.log" 2>&1; then
            grep -vE 'TOTP secret|[█▀▄]|^  [A-Z2-7]{16}$' "$E2E_DIR/install.log"
            exit 1
          fi
          sed -n '/^Installation complete/,$p' "$E2E_DIR/install.log"
          systemctl is-enabled nms-audit-anchor.timer
          systemctl show docker -p ExecStartPre | grep -q "/usr/local/bin/nmsctl egress apply"
          systemctl show docker -p ExecStartPost | grep -q "/usr/local/bin/nmsctl egress check"
      - name: Start the device simulator on the devices network
        run: |
          # Synthetic SNMPv3 user of test/sim/snmpsim/simtest. self.snmprec answers SNMPv3 with an
          # empty context name, as the poller sends it to real devices.
          docker run -d --name "$SNMPSIM" --network nms_devices \
            -v "$PWD/test/fixtures/snmp/generic-switch.snmprec:/data/self.snmprec:ro" nms-snmpsim:ci \
            sh -c 'mkdir -p /tmp/idx && chmod 777 /tmp/idx && exec snmpsim-command-responder \
              --process-user=nobody --process-group=nogroup --cache-dir=/tmp/idx --data-dir=/data \
              --agent-udpv4-endpoint=0.0.0.0:161 --v3-user=simuser --v3-auth-proto=SHA256 \
              --v3-auth-key=sim-auth-key-0123456789 --v3-priv-proto=AES --v3-priv-key=sim-priv-key-0123456789'
          for _ in $(seq 1 60); do docker logs "$SNMPSIM" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' && break; sleep 1; done
          docker logs "$SNMPSIM" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' || { docker logs "$SNMPSIM"; exit 1; }
          addr="$(docker inspect -f '{{(index .NetworkSettings.Networks "nms_devices").IPAddress}}' "$SNMPSIM")"
          echo "NMS_E2E_SNMPSIM=$addr" >> "$GITHUB_ENV"
      - name: Start egress capture
        run: |
          test/egress/capture.sh start
          # recreate the services with a route out (gateway: edge, poller and eventd: devices) so their startup is captured too
          sudo docker compose -f "$COMPOSE" up -d --wait --no-deps --force-recreate gateway poller eventd
      - name: Start the event sources on the devices network
        run: |
          # Two containers of the simulator image, each sending syslog (UDP, TCP) and a v2c linkDown trap to eventd
          # from its own address (test/e2e/send_events.py, standard library only). The "device" also answers SNMPv2c
          # (the data file name is the community, 16+ characters) so the poll the trap causes can succeed; the other
          # address belongs to no device. Devices reach eventd on the devices network directly: the published ports
          # are not used from inside the same bridge.
          #
          # Two more senders live in network namespaces joined to the host by a veth pair, which makes them like
          # devices on another network: their packets arrive at a host address, are DNAT'ed to the published
          # ports (PREROUTING), forwarded (FORWARD, DOCKER-USER) and reach eventd with the source address
          # unchanged. That proves that DNAT and FORWARD preserve the source address of off-host devices. (The
          # userland-proxy setting itself is enforced by the install preflight, preflight.go. A sender on the host
          # would prove nothing: its packets are masqueraded to the bridge gateway.)
          #   nms-ev-mgmt  172.31.250.2, inside the management subnet MGMT_EXTRA: accepted, attributed to its device.
          #   nms-ev-rogue 172.31.251.2, in no management subnet: dropped by the DOCKER-USER ingress rules.
          # TLS (6514) is verified against the installation's CA, for the name of the certificate (localhost).
          EVSRC=nms-e2e-evsrc EVROGUE=nms-e2e-evrogue COMMUNITY=e2e-events-community-01
          sudo install -m 0644 /etc/nms/secrets/ca.crt /tmp/nms-e2e-ca.crt
          docker run -d --name "$EVSRC" --network nms_devices \
            -v "$PWD/test/fixtures/snmp/generic-switch.snmprec:/data/$COMMUNITY.snmprec:ro" \
            -v "$PWD/test/e2e/send_events.py:/send_events.py:ro" -v /tmp/nms-e2e-ca.crt:/ca.crt:ro nms-snmpsim:ci \
            sh -c 'mkdir -p /tmp/idx && chmod 777 /tmp/idx && exec snmpsim-command-responder \
              --process-user=nobody --process-group=nogroup --cache-dir=/tmp/idx --data-dir=/data \
              --agent-udpv4-endpoint=0.0.0.0:161'
          docker run -d --name "$EVROGUE" --network nms_devices -v "$PWD/test/e2e/send_events.py:/send_events.py:ro" nms-snmpsim:ci sleep infinity
          for _ in $(seq 1 60); do docker logs "$EVSRC" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' && break; sleep 1; done
          docker logs "$EVSRC" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' || { docker logs "$EVSRC"; exit 1; }
          addr() { docker inspect -f '{{(index .NetworkSettings.Networks "nms_devices").IPAddress}}' "$1"; }
          EVENTD="$(addr "$(sudo docker compose -f "$COMPOSE" ps -q eventd)")"
          SRC="$(addr "$EVSRC")"; ROGUE="$(addr "$EVROGUE")"
          echo "eventd $EVENTD, device $SRC, stranger $ROGUE"
          [ -n "$EVENTD" ] && [ -n "$SRC" ] && [ -n "$ROGUE" ] && [ "$SRC" != "$ROGUE" ]
          docker exec -d "$EVSRC" python3 /send_events.py "$EVENTD" e2eknown "$COMMUNITY" /ca.crt localhost
          docker exec -d "$EVROGUE" python3 /send_events.py "$EVENTD" e2erogue "$COMMUNITY"
          echo "NMS_E2E_EVENT_SRC=$SRC" >> "$GITHUB_ENV"
          netns() { # NAME HOST_IP NS_IP: namespace NAME with a veth pair, host side HOST_IP/24, namespace side NS_IP/24
            sudo ip netns add "$1"
            sudo ip link add "vh-$1" type veth peer name "vn-$1"
            sudo ip link set "vn-$1" netns "$1"
            sudo ip addr add "$2/24" dev "vh-$1"
            sudo ip link set "vh-$1" up
            sudo ip netns exec "$1" ip addr add "$3/24" dev "vn-$1"
            sudo ip netns exec "$1" ip link set "vn-$1" up
            sudo ip netns exec "$1" ip link set lo up
            sudo ip netns exec "$1" ip route add default via "$2"
          }
          netns nms-ev-mgmt 172.31.250.1 172.31.250.2
          netns nms-ev-rogue 172.31.251.1 172.31.251.2
          sudo ip netns exec nms-ev-mgmt ping -c 1 -W 2 172.31.250.1
          sudo ip netns exec nms-ev-rogue ping -c 1 -W 2 172.31.251.1
          # published ports: 514 (UDP, TCP syslog) and 6514 (TLS), addressed to the host side of the veth
          sudo setsid nohup ip netns exec nms-ev-mgmt env SYSLOG_PORT=514 python3 test/e2e/send_events.py 172.31.250.1 e2enetns - /tmp/nms-e2e-ca.crt localhost > /tmp/nms-ev-mgmt.log 2>&1 &
          sudo setsid nohup ip netns exec nms-ev-rogue env SYSLOG_PORT=514 python3 test/e2e/send_events.py 172.31.251.1 e2eneg > /tmp/nms-ev-rogue.log 2>&1 &
          echo "NMS_E2E_EVENT_ROGUE=$ROGUE" >> "$GITHUB_ENV"
          echo "NMS_E2E_EVENT_NETNS=172.31.250.2" >> "$GITHUB_ENV"
          # The device of problems.spec.ts: answers SNMPv2c like EVSRC, but its trap is chosen by the test through a control file
          # (linkDown or linkUp for ifIndex 2). It serves two data files by community: COMMUNITY has ifIndex 2 down, so the polls the
          # linkDown trap causes agree with it and cannot close the problem before the test has acknowledged it; COMMUNITY_UP has
          # ifIndex 2 up, which the test switches to (by replacing the device's profile) before linkUp, so the polls then agree with
          # linkUp and never reopen the closed problem. The test writes the control file in test/e2e/.auth, mounted read-only here.
          # NMS_E2E_PROBE_DEAD is an address in the devices subnet nothing listens on:
          # the parent of the suppression check, which the poller finds down.
          EVPROB=nms-e2e-evprob
          mkdir -p test/e2e/.auth
          COMMUNITY_UP=e2e-events-community-02
          grep -qx '1.3.6.1.2.1.2.2.1.8.2|2|2' test/fixtures/snmp/generic-switch.snmprec
          sed 's/^1.3.6.1.2.1.2.2.1.8.2|2|2$/1.3.6.1.2.1.2.2.1.8.2|2|1/' test/fixtures/snmp/generic-switch.snmprec > /tmp/nms-e2e-probe-up.snmprec
          grep -qx '1.3.6.1.2.1.2.2.1.8.2|2|1' /tmp/nms-e2e-probe-up.snmprec
          docker run -d --name "$EVPROB" --network nms_devices \
            -v "$PWD/test/fixtures/snmp/generic-switch.snmprec:/data/$COMMUNITY.snmprec:ro" \
            -v "/tmp/nms-e2e-probe-up.snmprec:/data/$COMMUNITY_UP.snmprec:ro" \
            -v "$PWD/test/e2e/send_events.py:/send_events.py:ro" -v "$PWD/test/e2e/.auth:/ctl:ro" nms-snmpsim:ci \
            sh -c 'mkdir -p /tmp/idx && chmod 777 /tmp/idx && exec snmpsim-command-responder \
              --process-user=nobody --process-group=nogroup --cache-dir=/tmp/idx --data-dir=/data \
              --agent-udpv4-endpoint=0.0.0.0:161'
          for _ in $(seq 1 60); do docker logs "$EVPROB" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' && break; sleep 1; done
          docker logs "$EVPROB" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' || { docker logs "$EVPROB"; exit 1; }
          PROBE="$(addr "$EVPROB")"
          [ -n "$PROBE" ] && [ "$PROBE" != "$SRC" ]
          docker exec -d -e TRAP_CONTROL=/ctl/trap-control -e TRAP_IFINDEX=2 "$EVPROB" python3 /send_events.py "$EVENTD" e2eprob "$COMMUNITY"
          echo "NMS_E2E_EVENT_PROBE=$PROBE" >> "$GITHUB_ENV"
          echo "NMS_E2E_PROBE_DEAD=${PROBE%.*}.250" >> "$GITHUB_ENV"
      - name: Start the topology fixtures on the devices network
        run: |
          # One simulator container per test/fixtures/snmp/topology-*.snmprec at the fixed address test/lab/topology.yaml gives it
          # (the LLDP tables of the fixtures name these addresses as management addresses; they lie in the devices subnet, which is
          # a management subnet). SNMPv2c: the community is the data file name.
          grep -E '^    (fixture|address|community):' test/lab/topology.yaml | paste -d' ' - - - | while read -r _ addr _ fixture _ community; do
            name="nms-e2e-$fixture"
            docker run -d --name "$name" --network nms_devices --ip "$addr" \
              -v "$PWD/test/fixtures/snmp/$fixture.snmprec:/data/$community.snmprec:ro" nms-snmpsim:ci \
              sh -c 'mkdir -p /tmp/idx && chmod 777 /tmp/idx && exec snmpsim-command-responder \
                --process-user=nobody --process-group=nogroup --cache-dir=/tmp/idx --data-dir=/data \
                --agent-udpv4-endpoint=0.0.0.0:161'
            for _ in $(seq 1 60); do docker logs "$name" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' && break; sleep 1; done
            docker logs "$name" 2>&1 | grep -q 'Listening at UDP/IPv4 endpoint' || { docker logs "$name"; exit 1; }
            got="$(docker inspect -f '{{(index .NetworkSettings.Networks "nms_devices").IPAddress}}' "$name")"
            echo "$fixture at $got"
            [ "$got" = "$addr" ]
          done
          [ "$(docker ps -q --filter name=nms-e2e-topology- | wc -l)" -eq "$(grep -c '^    fixture:' test/lab/topology.yaml)" ]
      - name: Install e2e dependencies
        run: bun install --frozen-lockfile
        working-directory: test/e2e
      - name: Playwright
        run: >-
          docker run --rm --init --ipc=host --network host
          -v "$PWD/test/e2e:/e2e" -v "$PWD/test/lab:/lab:ro" -v "$E2E_DIR:/creds:ro" -e NMS_E2E_DIR=/creds -e NMS_E2E_LAB=/lab -e NMS_E2E_SNMPSIM
          -e NMS_E2E_EVENT_SRC -e NMS_E2E_EVENT_ROGUE -e NMS_E2E_EVENT_NETNS -e NMS_E2E_EVENT_PROBE -e NMS_E2E_PROBE_DEAD -w /e2e
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          node node_modules/@playwright/test/cli.js test
      - name: The trap, not the API, queued the poll
        run: |
          # poll_now is queued by the API (POST /poll, not used by events.spec.ts) or by eventd: a job row for the device
          # that events.spec.ts watched proves that eventd queued it.
          id="$(sudo cat test/e2e/.auth/events-device-id)"
          n="$(sudo docker compose -f "$COMPOSE" exec -T postgres psql -U postgres -d nms -tA -c "select count(*) from jobs.river_job where kind = 'poll_now' and (args->>'device_id')::bigint = $id")"
          echo "poll_now jobs for device $id: $n"
          [ "$n" -ge 1 ]
      - name: Non-management sources cannot reach the eventd ports
        run: |
          # The sender in nms-ev-rogue (172.31.251.2, no management subnet) has been sending to the published port 514
          # since the start of the job. Its packets are forwarded towards eventd's network and must be dropped by the
          # DOCKER-USER ingress rules (before MASQUERADE, so this does not depend on eventd): their counters grow,
          # and events.spec.ts has seen nothing of it in the event feed. The rules are found by their comment.
          pkts() { sudo iptables -w -L DOCKER-USER -n -v -x | awk -v c="nms-ingress-$1" '$3 == "DROP" && index($0, c) {s += $1} END {print s + 0}'; }
          u="$(pkts udp-1514)"; t="$(pkts tcp-1514)"
          echo "dropped by the ingress rules: udp $u packets, tcp $t packets"
          [ "$u" -gt 0 ] && [ "$t" -gt 0 ]
          sudo iptables -w -S DOCKER-USER
      - name: Audit anchor timer unit and audit verify
        run: |
          sudo systemctl start nms-audit-anchor.service
          sudo /usr/local/bin/nmsctl audit verify
      - name: Second install is refused
        run: |
          if out="$(sudo /usr/local/bin/nmsctl install $INSTALL_ARGS --totp-secret-out "$E2E_DIR/totp-again" 2>&1)"; then
            echo "second install succeeded"; exit 1
          fi
          echo "$out"
          grep -q "already installed" <<<"$out"
      - name: Zero egress
        run: EGRESS_ALLOW="$MGMT_EXTRA" test/egress/capture.sh check
      - name: Devices network reaches only the management subnets
        run: |
          # NETSHOOT: nicolaka/netshoot v0.16 (as in test/egress/capture.sh)
          NETSHOOT=nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          rules() { sudo iptables -w -S DOCKER-USER | grep -c -- "-s $DEVICES_SUBNET" || true; }
          sudo iptables -w -C DOCKER-USER -s "$DEVICES_SUBNET" -j DROP
          before="$(rules)"
          sudo /usr/local/bin/nmsctl egress apply
          [ "$(rules)" = "$before" ] || { echo "egress apply is not idempotent"; sudo iptables -w -S DOCKER-USER; exit 1; }
          # control: outside the devices network the host routes out, so a failure below is the DROP rule
          docker run --rm --network bridge "$NETSHOOT" nc -z -w 5 1.1.1.1 443
          if docker run --rm --network nms_devices "$NETSHOOT" nc -z -w 5 1.1.1.1 443; then
            echo "devices network reached 1.1.1.1"; exit 1
          fi
          sudo iptables -w -S DOCKER-USER
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://localhost
          # ghcr.io/zaproxy/zaproxy:20260807-stable (ZAP 2.17.0)
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: .zap/rules.tsv
          # -I: WARN does not fail; FAIL rules (every Medium+ rule) do
          cmd_options: -I
          fail_action: true
          allow_issue_writing: false
      # Last: it restarts Docker and with it the stack.
      - name: Docker applies the egress rules before it starts
        run: |
          sudo iptables -w -D DOCKER-USER -s "$DEVICES_SUBNET" -j DROP
          sudo systemctl restart docker
          sudo iptables -w -C DOCKER-USER -s "$DEVICES_SUBNET" -j DROP
          sudo iptables -w -C DOCKER-USER -d "$DEVICES_SUBNET" -p udp -m udp --dport 1514 -m comment --comment nms-ingress-udp-1514 -j DROP
          sudo iptables -w -C FORWARD -j DOCKER-USER
          sudo iptables -w -S DOCKER-USER
      - name: Service logs
        if: failure()
        run: |
          sudo docker compose -f "$COMPOSE" logs --no-color --tail 300
          docker logs --tail 100 "$SNMPSIM" || true
          docker logs --tail 100 nms-e2e-evsrc || true
          docker logs --tail 100 nms-e2e-evprob || true
          cat /tmp/nms-ev-mgmt.log /tmp/nms-ev-rogue.log || true
