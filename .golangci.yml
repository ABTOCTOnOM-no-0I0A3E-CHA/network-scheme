version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use structured logging (log/slog) instead of fmt.Print*
        - pattern: ^os\.Getenv$
          msg: configuration is read in cmd/ only; secrets come from files
      analyze-types: true
  exclusions:
    rules:
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [gosec]
